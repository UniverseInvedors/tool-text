function updateCount(){
  var text=document.getElementById('count-input').value
  var words=text.trim()?text.trim().split(/\s+/).length:0
  var chars=text.length
  var charsNoSpace=text.replace(/\s/g,'').length
  var sentences=text.split(/[.!?]+/).filter(function(s){return s.trim()}).length
  var paragraphs=text.split(/\n\n+/).filter(function(p){return p.trim()}).length
  var lines=text.split('\n').length
  var readTime=Math.ceil(words/200)
  var speakTime=Math.ceil(words/130)

  // Flesch Reading Ease score
  var syllables=countSyllables(text)
  var fre=words>0&&sentences>0?Math.round(206.835-1.015*(words/sentences)-84.6*(syllables/words)):0
  var freLabel=fre>=90?'Very Easy':fre>=80?'Easy':fre>=70?'Fairly Easy':fre>=60?'Standard':fre>=50?'Fairly Difficult':fre>=30?'Difficult':'Very Confusing'

  var stats=[
    {v:words,l:'Words'},{v:chars,l:'Characters'},{v:charsNoSpace,l:'No Spaces'},
    {v:sentences,l:'Sentences'},{v:paragraphs,l:'Paragraphs'},{v:lines,l:'Lines'},
    {v:readTime+'m',l:'Read Time'},{v:speakTime+'m',l:'Speak Time'},
    {v:words>0?fre:'-',l:'Flesch Score'},{v:words>0?freLabel:'-',l:'Reading Level'},
  ]
  document.getElementById('count-stats').innerHTML=stats.map(function(s){
    return'<div class="stat-card"><div class="stat-val">'+s.v+'</div><div class="stat-lbl">'+s.l+'</div></div>'
  }).join('')
  // Keywords
  var wordList=text.toLowerCase().match(/\b[a-z]{3,}\b/g)||[]
  var freq={}
  wordList.forEach(function(w){if(!STOPWORDS.includes(w)){freq[w]=(freq[w]||0)+1}})
  var top=Object.entries(freq).sort(function(a,b){return b[1]-a[1]}).slice(0,10)
  document.getElementById('count-keywords').innerHTML=top.map(function(w){
    return'<span style="display:inline-flex;align-items:center;gap:.3rem;padding:.2rem .55rem;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-md);font-size:.72rem;cursor:pointer" onclick="copyText(\''+w[0]+'\')">'+w[0]+' <span style="color:var(--accent-light);font-weight:700">'+w[1]+'</span></span>'
  }).join('')||'<span style="font-size:.75rem;color:var(--text-4)">Type something to see keyword frequency</span>'
}

function countSyllables(text){
  var words=text.toLowerCase().match(/\b[a-z]+\b/g)||[]
  return words.reduce(function(total,word){
    word=word.replace(/e$/,'')
    var count=(word.match(/[aeiou]{1,2}/g)||[]).length
    return total+Math.max(1,count)
  },0)
}

// CASE
function convertCase(type){
  var text=document.getElementById('case-input').value
  if(!text){toast('Type something first','err');return}
  var result=''
  switch(type){
    case 'upper':result=text.toUpperCase();break
    case 'lower':result=text.toLowerCase();break
    case 'title':result=text.replace(/\w\S*/g,function(t){return t.charAt(0).toUpperCase()+t.slice(1).toLowerCase()});break
    case 'sentence':result=text.toLowerCase().replace(/(^\s*\w|[.!?]\s*\w)/g,function(c){return c.toUpperCase()});break
    case 'camel':result=text.toLowerCase().replace(/[^a-zA-Z0-9]+(.)/g,function(_,c){return c.toUpperCase()});result=result.charAt(0).toLowerCase()+result.slice(1);break
    case 'pascal':result=text.toLowerCase().replace(/(?:^|[^a-zA-Z0-9]+)(.)/g,function(_,c){return c.toUpperCase()});break
    case 'snake':result=text.trim().toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');break
    case 'kebab':result=text.trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');break
    case 'constant':result=text.trim().toUpperCase().replace(/[^A-Z0-9]+/g,'_').replace(/^_|_$/g,'');break
    case 'alternate':result=text.split('').map(function(c,i){return i%2===0?c.toLowerCase():c.toUpperCase()}).join('');break
    case 'reverse':result=text.split('').reverse().join('');break
    case 'capitalize':result=text.replace(/\b\w/g,function(c){return c.toUpperCase()});break
  }
  document.getElementById('case-output').value=result
  toast('Converted to '+type,'ok')
}

    if(startClassic)result=['Lorem','ipsum','dolor','sit','amet'].concat(result.slice(5))

  document.getElementById('lorem-output').value=result.join(type==='paragraphs'?'\n\n':' ')

// DIFF
function runDiff(){
  var t1=document.getElementById('diff-1').value.split('\n')
  var t2=document.getElementById('diff-2').value.split('\n')
  var result=[],i1=0,i2=0
  while(i1<t1.length||i2<t2.length){
    if(i1<t1.length&&i2<t2.length){
      if(t1[i1]===t2[i2]){result.push({type:'same',text:t1[i1]});i1++;i2++}
      else{
        // Look ahead for match
        var found=false
        for(var look=1;look<3;look++){
          if(i1+look<t1.length&&t1[i1+look]===t2[i2]){for(var k=0;k<look;k++){result.push({type:'del',text:t1[i1+k]})};i1+=look;found=true;break}
          if(i2+look<t2.length&&t1[i1]===t2[i2+look]){for(var k=0;k<look;k++){result.push({type:'add',text:t2[i2+k]})};i2+=look;found=true;break}
        }
        if(!found){result.push({type:'del',text:t1[i1]});result.push({type:'add',text:t2[i2]});i1++;i2++}
      }
    }else if(i1<t1.length){result.push({type:'del',text:t1[i1++]})}
    else{result.push({type:'add',text:t2[i2++]})}
  }
  var html=result.map(function(l){
    var cls=l.type==='add'?'diff-add':l.type==='del'?'diff-del':'diff-same'
    var prefix=l.type==='add'?'+ ':l.type==='del'?'- ':'  '
    return'<div class="diff-line '+cls+'">'+prefix+l.text+'</div>'
  }).join('')
  document.getElementById('diff-result').innerHTML=html||'<p style="color:var(--t4);padding:1rem">No differences found ✓</p>'
  toast('Diff complete','ok')
}

// LINES
function lineOp(op){
  var text=document.getElementById('lines-input').value
  if(!text){toast('Paste text first','err');return}
  var lines=text.split('\n'),result
  switch(op){
    case 'sort-asc':result=lines.sort();break
    case 'sort-desc':result=lines.sort().reverse();break
    case 'dedup':result=[...new Set(lines)];break
    case 'reverse':result=lines.reverse();break
    case 'trim':result=lines.map(function(l){return l.trim()});break
    case 'remove-empty':result=lines.filter(function(l){return l.trim()});break
    case 'number':result=lines.map(function(l,i){return (i+1)+'. '+l});break
    case 'shuffle':result=lines.map(function(l){return{line:l,sort:Math.random()}}).sort(function(a,b){return a.sort-b.sort}).map(function(o){return o.line});break
    default:result=lines
  }
  document.getElementById('lines-output').value=result.join('\n')
  toast(op+' applied','ok')
}

// FIND & REPLACE
function findReplace(){
  var input=document.getElementById('fr-input').value
  var find=document.getElementById('fr-find').value
  var replace=document.getElementById('fr-replace').value
  var useRegex=document.getElementById('fr-regex').checked
  var caseSensitive=document.getElementById('fr-case').checked
  if(!input){toast('Paste text first','err');return}
  if(!find){toast('Enter search text','err');return}
  var result,count=0
  try{
    if(useRegex){
      var flags='g'+(caseSensitive?'':'i')
      var re=new RegExp(find,flags)
      var matches=input.match(re)
      count=matches?matches.length:0
      result=input.replace(re,replace)
    }else{
      var escaped=find.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')
      var flags='g'+(caseSensitive?'':'i')
      var re=new RegExp(escaped,flags)
      var matches=input.match(re)
      count=matches?matches.length:0
      result=input.replace(re,replace)
    }
    document.getElementById('fr-output').value=result
    document.getElementById('fr-count').textContent=count+' replacement'+(count!==1?'s':'')+' made'
    toast(count+' replacement'+(count!==1?'s':'')+' made','ok')
  }catch(e){
    toast('Regex error: '+e.message.slice(0,40),'err')
  }
}

    svgEl.style.cssText='position:fixed;inset:0;width:100%;height:100%;z-index:9001;pointer-events:none';
    var defs=document.createElementNS(svgNS,'defs');
    var clip=document.createElementNS(svgNS,'clipPath');
    clip.id='tour-clip';
    var outerR=document.createElementNS(svgNS,'rect');
    outerR.setAttribute('width','200%');outerR.setAttribute('height','200%');
    var holeR=document.createElementNS(svgNS,'rect');
    holeR.id='tour-hole';
    clip.appendChild(outerR);clip.appendChild(holeR);defs.appendChild(clip);
    var dimR=document.createElementNS(svgNS,'rect');
    dimR.setAttribute('width','200%');dimR.setAttribute('height','200%');
    dimR.setAttribute('clip-path','url(#tour-clip)');
    dimR.setAttribute('fill','rgba(3,5,10,0.78)');
    var glowR=document.createElementNS(svgNS,'rect');
    glowR.id='tour-glow';
    glowR.setAttribute('fill','none');

    glowR.setAttribute('stroke-width','2');
    svgEl.appendChild(defs);svgEl.appendChild(dimR);svgEl.appendChild(glowR);
    overlay.appendChild(svgEl);

    tipEl=document.createElement('div');
    tipEl.id='tour-tip';
    tipEl.innerHTML=
      '<div class="tour-progress"><div class="tour-progress-fill" id="tour-pfill"></div></div>'+
      '<div class="tour-step-label" id="tour-slbl"></div>'+
      '<div class="tour-tip-title" id="tour-ttl"></div>'+
      '<div class="tour-tip-body" id="tour-tbdy"></div>'+
      '<div class="tour-footer">'+
        '<div class="tour-dots" id="tour-dots"></div>'+
        '<div class="tour-nav">'+
          '<button class="tour-nav-btn tour-prev" id="tour-prev" onclick="__tourPrev()" aria-label="Previous">&#8592; Prev</button>'+
          '<button class="tour-nav-btn tour-next" id="tour-next" onclick="__tourNext()" aria-label="Next">Next &#8594;</button>'+
        '</div>'+
      '</div>'+
      '<button class="tour-skip" onclick="endTour()">Skip tour &times;</button>';
    overlay.appendChild(tipEl);
    document.body.appendChild(overlay);

    overlay.addEventListener('click',function(e){if(e.target===overlay)endTour();});
    document.addEventListener('keydown',function(e){
      if(!active)return;
      if(e.key==='Escape')endTour();
      if(e.key==='ArrowRight'||e.key==='Enter')__tourNext();

    renderDots();
    var seen=localStorage.getItem(TOUR_KEY);
    if(!seen)setTimeout(function(){startTour();},1500);
  }

  function renderDots(){
    var d=document.getElementById('tour-dots');
    if(!d)return;
    d.innerHTML=steps.map(function(_,i){
      return'<div class="tour-dot'+(i===current?' active':'')+'" onclick="__tourGo('+i+')" tabindex="0" role="button" aria-label="Step '+(i+1)+'"></div>';
    }).join('');
  }

  function spotlight(el){
    if(!el)return;
    var r=el.getBoundingClientRect(),p=10,rx=10;
    var x=r.left-p,y=r.top-p,w=r.width+p*2,h=r.height+p*2;
    var hole=document.getElementById('tour-hole');
    var glow=document.getElementById('tour-glow');
    if(hole){hole.setAttribute('x',x);hole.setAttribute('y',y);hole.setAttribute('width',w);hole.setAttribute('height',h);hole.setAttribute('rx',rx);}
    if(glow){glow.setAttribute('x',x);glow.setAttribute('y',y);glow.setAttribute('width',w);glow.setAttribute('height',h);glow.setAttribute('rx',rx);}
    el.scrollIntoView({behavior:'smooth',block:'nearest',inline:'nearest'});
  }

  function positionTip(el,side){
    if(!tipEl||!el)return;
    tipEl.className='';
    var r=el.getBoundingClientRect();
    var tw=tipEl.offsetWidth||320,th=tipEl.offsetHeight||220;
    var vw=window.innerWidth,vh=window.innerHeight,m=16;
    var top,left,arrow;
    if(side==='bottom'&&r.bottom+th+m<vh){top=r.bottom+m;left=r.left;arrow='top';}
    else if(side==='top'&&r.top-th-m>0){top=r.top-th-m;left=r.left;arrow='bottom';}
    else if(side==='right'&&r.right+tw+m<vw){top=r.top;left=r.right+m;arrow='left';}
    else if(side==='left'&&r.left-tw-m>0){top=r.top;left=r.left-tw-m;arrow='right';}
    else{top=Math.min(r.bottom+m,vh-th-m);left=r.left;arrow='top';}
    left=Math.max(m,Math.min(left,vw-tw-m));
    top=Math.max(m+56,Math.min(top,vh-th-m));
    tipEl.style.top=top+'px';tipEl.style.left=left+'px';
    tipEl.classList.add('arrow-'+arrow);
  }

  function renderStep(idx){
    if(idx<0||idx>=steps.length)return;
    current=idx;
    var step=steps[idx],total=steps.length;
    var el=step.sel?document.querySelector(step.sel):null;
    document.getElementById('tour-slbl').textContent='Step '+(idx+1)+' of '+total;
    document.getElementById('tour-ttl').textContent=step.title||'';
    document.getElementById('tour-tbdy').textContent=step.body||'';
    var pf=document.getElementById('tour-pfill');
    if(pf)pf.style.width=Math.round(((idx+1)/total)*100)+'%';
    var prev=document.getElementById('tour-prev');
    var next=document.getElementById('tour-next');
    if(prev)prev.style.display=idx===0?'none':'';
    if(next)next.textContent=idx===total-1?'Finish \u2713':'Next \u2192';
    document.querySelectorAll('.tour-dot').forEach(function(d,i){d.classList.toggle('active',i===idx);});
    if(el){
      spotlight(el);
      setTimeout(function(){positionTip(el,step.tip||'bottom');},80);
    }else{
      var hole=document.getElementById('tour-hole');
      if(hole){hole.setAttribute('width','0');hole.setAttribute('height','0');}
      tipEl.style.top='50%';tipEl.style.left='50%';
      tipEl.style.transform='translate(-50%,-50%)';
    }
  }

  window.__tourGo=function(i){if(active)renderStep(i);};
  window.__tourNext=function(){if(!active)return;if(current>=steps.length-1){endTour();return;}renderStep(current+1);};
  window.__tourPrev=function(){if(active&&current>0)renderStep(current-1);};

  window.startTour=function(){
    if(!steps.length)return;
    active=true;current=0;
    overlay.classList.add('active');
    document.body.style.overflow='hidden';
    renderStep(0);
  };

  window.endTour=function(){
    active=false;
    if(overlay)overlay.classList.remove('active');
    document.body.style.overflow='';
    localStorage.setItem(TOUR_KEY,'1');
  };

  window.resetTour=function(){localStorage.removeItem(TOUR_KEY);};

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',init);
  }else{
    setTimeout(init,0);
  }
})();

</script>
